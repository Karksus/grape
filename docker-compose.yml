services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civic
    ports:
      - "5432:5432"
    volumes:
      - civic_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  civic_pgdata: